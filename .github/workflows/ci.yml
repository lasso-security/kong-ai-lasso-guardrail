name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Lua 5.1 = OpenResty/LuaJIT target (what Kong runs).
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10.0.0
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4.3.0

      - name: Install busted
        run: luarocks install busted

      - name: Lua syntax check (parse all sources + specs)
        run: |
          for f in $(find kong spec -name '*.lua' | sort); do
            lua -e "assert(loadfile('$f'))" && echo "ok   $f"
          done

      - name: Unit tests (busted)
        run: busted spec/ai-lasso-guardrail/lasso_spec.lua

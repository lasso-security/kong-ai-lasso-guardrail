name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lua 5.1 = OpenResty/LuaJIT target (what Kong runs).
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      - name: Lua syntax check (parse all sources + specs)
        run: |
          for f in $(find kong spec scripts ai-gateway -name '*.lua' | sort); do
            lua -e "assert(loadfile('$f'))" && echo "ok   $f"
          done

      # ai-gateway/handler.lua is generated from kong/plugins/; fail if someone forgot to rebuild.
      - name: AI Gateway policy bundle is up to date
        run: lua scripts/build-policy.lua --check

      - name: Unit tests (busted)
        run: busted spec/ai-lasso-guardrail/lasso_spec.lua spec/ai-lasso-guardrail/policy_bundle_spec.lua

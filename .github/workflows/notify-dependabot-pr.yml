name: Alert on Dependabot PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write 

jobs:
  notify:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Send Dependabot Alert
        uses: lasso-security/github-action/dependabot-new-pr-alert@dev
        with:
          slack_bot_token: ${{ secrets.SLACK_GITHUB_BOT }}

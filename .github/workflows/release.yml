name: release

# Publish the LuaRocks rock for a version tag: pushed by hand, or called by
# `tag-release` (a GITHUB_TOKEN-pushed tag starts no run).
# Requires a repo/org secret LUAROCKS_API_KEY (DevOps to provision).
on:
  push:
    tags: ["*"]
  workflow_call:
    inputs:
      tag:
        description: "Version tag to publish"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install JSON dependency for luarocks upload
        run: luarocks install dkjson
      - name: Upload rock to LuaRocks
        run: luarocks upload ai-lasso-guardrail-*.rockspec --api-key="${{ secrets.LUAROCKS_API_KEY }}"

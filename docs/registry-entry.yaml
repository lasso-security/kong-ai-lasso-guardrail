# Registry entry for the Lasso AI-gateway integration parity matrix.
#
# Belongs in `references/registry.yaml` in the `lasso-security/skills` repo (the
# new-ai-gateway-integration skill). Add under `integrations:`, then regenerate:
#   python scripts/render-registry.py   (never hand-edit registry.md)
#
# Kept here as the source-of-record for the skills-repo PR.

- id: kong
  name: Kong ai-lasso-guardrail plugin
  language: Lua
  archetype: in-process plugin (Lua)
  repo: https://github.com/lasso-security/kong-ai-lasso-guardrail
  reference_file: kong/plugins/ai-lasso-guardrail/handler.lua
  parity:
    input-scan: yes
    output-scan: yes
    target-v3: yes
    action-granularity: yes
    enforce-block: yes
    enforce-mask: yes
    source: yes
    tools: yes
    session: yes
    config-base-url: yes
    fail-mode: open (configurable)
    streaming-stance: out of scope
    docs: unknown
  gaps:
    - Streaming not scanned — response scanning uses Kong's buffered `response` phase, which disables SSE streaming for the route (leave guard_response off for streaming clients).
    - Masking span offsets are byte-based (Lua), so multi-byte UTF-8 PII could misalign; Lasso's authoritative masked `messages` are preferred when present.
    - Custom plugin: self-serve on self-hosted Kong (OSS/EE); on Konnect it needs Custom Plugin Streaming (schema.lua + handler.lua only). Not in the Plugin Hub (would need a Kong partnership).
